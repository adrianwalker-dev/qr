<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>QR Code Generator</h1>
      <p>Enter text or a URL to generate a QR code</p>
    </header>

    <div class="card">
      <div class="input-group">
        <label for="qr-text">Text / URL</label>
        <input type="text" id="qr-text" placeholder="e.g. https://example.com" />
      </div>

      <div class="options">
        <div class="option-group">
          <label>Size</label>
          <select id="qr-size">
            <option value="200">200px</option>
            <option value="256" selected>256px</option>
            <option value="300">300px</option>
            <option value="400">400px</option>
            <option value="500">500px</option>
          </select>
        </div>

        <div class="option-group">
          <label>Foreground Color</label>
          <input type="color" id="qr-color" value="#000000" />
        </div>

        <div class="option-group">
          <label>Background Color</label>
          <input type="color" id="qr-bgcolor" value="#ffffff" />
        </div>
      </div>

      <div class="actions">
        <button id="generate-btn" type="button">Generate QR Code</button>
        <button id="download-btn" type="button" disabled>Download PNG</button>
      </div>
    </div>

    <div class="preview">
      <div id="qrcode"></div>
      <p id="empty-state" class="hidden">Your QR code will appear here.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
